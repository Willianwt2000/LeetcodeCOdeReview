    <script>
      const ENABLE_BG_SUBMIT = false;
      const UPLOADCARE_PUBLIC_KEY = "3f891a9e00d6dac01f9c";
      const HUBSPOT_PORTAL_ID = "50393587";
      const HUBSPOT_FORM_GUID = "26e75d08-951f-4412-b627-95c363f797aa";
      const MAX_FILE_MB = 25;
      const ALLOWED_EXT = ["pdf","jpg","jpeg","png"];

      function getLeadEmail() {
        const el = document.querySelector("[data-lead-email]");
        return el ? el.getAttribute("data-lead-email") : (localStorage.getItem("leadEmail") || "");
      }
      function extOf(f){ return (f.name.split(".").pop()||"").toLowerCase(); }
      function mb(n){ return Math.round(n/104857.6)/10; }

      async function uploadToUploadcare(file) {
        const fd = new FormData();
        fd.append("UPLOADCARE_PUB_KEY", UPLOADCARE_PUBLIC_KEY);
        fd.append("UPLOADCARE_STORE", "auto");
        fd.append("file", file);
        const r = await fetch("https://upload.uploadcare.com/base/", { method:"POST", body: fd });
        if (!r.ok) throw new Error("Upload failed");
        const j = await r.json(); // { file: "UUID" }
        return `https://ucarecdn.com/${j.file}/`;
      }

      async function submitUrlsToHubSpot({ bankUrl, dlUrl, checkUrl }) {
        const leadEmail = getLeadEmail();
        if (!leadEmail) {
          console.error("No email found for HubSpot submission");
          throw new Error("Email required for submission");
        }

        const hutk = (document.cookie.match(/hubspotutk=([^;]+)/) || [])[1] || "";
        const payload = {
          fields: [
            { name: "email", value: leadEmail },
            { name: "bank_statement_url_wispfi", value: bankUrl || "" },
            { name: "driver_license_url_wispfi", value: dlUrl || "" },
            { name: "voided_check_url_wispfi", value: checkUrl || "" },
          ],
          context: { hutk, pageUri: location.href, pageName: document.title }
        };
        const url = `https://api.hsforms.com/submissions/v3/integration/submit/${HUBSPOT_PORTAL_ID}/${HUBSPOT_FORM_GUID}`;
        const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
        if (!r.ok) throw new Error("HubSpot submit failed: " + await r.text());
      }

      const $ = (id)=>document.getElementById(id);
      const bankIn=$("bankStatements"), dlIn=$("driversLicense"), checkIn=$("voidedCheck");
      const bankUrl=$("bankStatementsUrl"), dlUrl=$("driversLicenseUrl"), checkUrl=$("voidedCheckUrl");
      const bankSt=$("bankStatus"), dlSt=$("dlStatus"), checkSt=$("checkStatus");

      function valid(file, st){
        if(!file) return false;
        if(file.size > MAX_FILE_MB*1048576){ st.textContent=`File too large (${mb(file.size)}MB). Max ${MAX_FILE_MB}MB.`; return false; }
        if(!ALLOWED_EXT.includes(extOf(file))){ st.textContent=`Use: ${ALLOWED_EXT.join(", ")}`; return false; }
        return true;
      }

      async function handleChange(inputEl, stEl, hiddenEl, fieldName){
        const f = inputEl?.files?.[0]; if(!valid(f, stEl)) return;
        stEl.textContent = "Uploading…";
        try{
          const url = await uploadToUploadcare(f);
          hiddenEl.value = url;
          console.log("Uploaded →", fieldName, url);
          stEl.textContent = "Uploaded ✔ Saving to CRM…";
          if (ENABLE_BG_SUBMIT) {
            await submitUrlsToHubSpot({ bankUrl: bankUrl.value, dlUrl: dlUrl.value, checkUrl: checkUrl.value });
          }
          stEl.textContent = "Saved to HubSpot ✔";
        }catch(e){ console.error(e); stEl.textContent = "Upload failed. Try again."; }
      }

      bankIn?.addEventListener("change", ()=>handleChange(bankIn, bankSt, bankUrl, "bank_statement_url_wispfi"));
      dlIn  ?.addEventListener("change", ()=>handleChange(dlIn,   dlSt,   dlUrl, "driver_license_url_wispfi"));
      checkIn?.addEventListener("change", ()=>handleChange(checkIn, checkSt, checkUrl, "voided_check_url_wispfi"));
    </script>

    <!-- GCLID/GBRAID/WBRAID Capture Script -->
    <script>
      (function () {
        if (window.__wispfiLeadIdScriptLoaded) return;
        window.__wispfiLeadIdScriptLoaded = true;

        function getParam(name, url) {
          try {
            if (!url) url = location.href;
            name = name.replace(/[[\]]/g, "\\$&");
            var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)","i"),
                results = regex.exec(url);
            if (!results || !results[2]) return null;
            return decodeURIComponent(results[2].replace(/\+/g, " "));
          } catch(e){ return null; }
        }
        function setCookie(name, value, days) {
          try {
            if (!value) return;
            var d = new Date(); d.setTime(d.getTime() + (days*24*60*60*1000));
            document.cookie = name+"="+encodeURIComponent(value)+"; path=/; expires="+d.toUTCString()+"; SameSite=Lax";
          } catch(e){}
        }
        function getCookie(name) {
          try {
            var m = document.cookie.match(new RegExp("(^| )"+name+"=([^;]+)"));
            return m ? decodeURIComponent(m[2]) : null;
          } catch(e){ return null; }
        }
        function valOrCookie(param, cookieName) {
          return getParam(param) || getCookie(cookieName);
        }

        // Capture or reuse values
        var gclid  = valOrCookie("gclid",  "gclid");
        var gbraid = valOrCookie("gbraid", "gbraid");
        var wbraid = valOrCookie("wbraid", "wbraid");

        // Persist for 90 days
        if (gclid)  setCookie("gclid",  gclid,  90);
        if (gbraid) setCookie("gbraid", gbraid, 90);
        if (wbraid) setCookie("wbraid", wbraid, 90);

        // Optional debug + GTM visibility


        // Fill HubSpot fields when present
        function fill(root) {
          try {
            var map = [
              {prop:"gclid_wispfi",  val: gclid},
              {prop:"gbraid_wispfi", val: gbraid},
              {prop:"wbraid_wispfi", val: wbraid}
            ];
            map.forEach(function(m){
              if (!m.val) return;
              var sel = 'input[name="'+m.prop+'"], textarea[name="'+m.prop+'"], select[name="'+m.prop+'"]';
              var el  = (root || document).querySelector(sel);
              if (el) {
                if (!el.value) {
                  el.value = m.val;
                  ["input","change","blur"].forEach(function(evt){
                    try { el.dispatchEvent(new Event(evt, {bubbles:true})); } catch(e){}
                  });
                }
              } else {
                // Property not in this form; log once
                if (!window.__wispfiLeadIdMissing) window.__wispfiLeadIdMissing = {};
                if (!window.__wispfiLeadIdMissing[m.prop]) {
                  console.debug("HubSpot field not found on this form:", m.prop);
                  window.__wispfiLeadIdMissing[m.prop] = true;
                }
              }
            });
          } catch(e){}
        }

        // Initial attempt
        fill(document);

        // Observe dynamic injections
        try {
          if (!window.__wispfiLeadIdMO) {
            var mo = new MutationObserver(function(muts){
              muts.forEach(function(m){ m.addedNodes && m.addedNodes.forEach(function(n){
                if (n && n.querySelector) fill(n);
              });});
            });
            mo.observe(document.documentElement, {childList:true, subtree:true});
            window.__wispfiLeadIdMO = mo;
          }
        } catch(e){}

        // HubSpot form callbacks
        try {
          if (!window.__wispfiLeadIdHSListener) {
            window.addEventListener('message', function(e){
              try {
                var data = e.data || {};
                if (data.type === 'hsFormCallback' && (data.eventName === 'onFormReady' || data.eventName==='onFormSubmit')) {
                  var container = data.selector ? document.querySelector(data.selector) : document;
                  fill(container || document);
                }
              } catch(err){}
            }, false);
            window.__wispfiLeadIdHSListener = true;
          }
        } catch(e){}
      })();
    </script>
