<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social NetWork</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-600 max-w-xl mx-auto boder border-black bg-gradient-to-b front-black via-sky-950 to gray-800">
    <header class="text-white">
        <img src="/assets//img//image.png" alt="Enigma"
            class="h-96 object-cover mask-radial-at-center mask-radial-from-10% mask-radial-to-80%">


            <header>
                <span class="flex justify-center items-center">@Enigma</span>
            </header>
        <section class="flex gap-2">

            <!--Boton youtube  -->

            <a class="bg-zinc-900 hover:scale-110 transition-transform p-2 w-12 h-12 flex items-center justify-center rounded-full"
                href="https://github.com" target="_blank" aria-label="Github"
                title="Going to the enigma github channel">
                <svg width="28" height="28" class="text-white fill-white">
                    <use xlink:href="./assets/sprites.svg#github" />
                </svg>
            </a>



            <!-- Botón de X (anteriormente Twitter) -->
            <a class="bg-neutral-900 hover:bg-neutral-800 hover:scale-110 transition-transform p-2 w-12 h-12 flex items-center justify-center rounded-full border border-white/20"
                href="https://twitter.com" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)"
                title="Going to the enigma X profile">
                <svg width="28" height="28" class="text-white fill-white">
                    <use xlink:href="./assets/sprites.svg#x" />
                </svg>
            </a>

            <!-- Botón de Instagram con degradado -->
            <a class="bg-gradient-to-br from-yellow-400 via-pink-500 to-purple-600 hover:scale-110 transition-transform p-2 w-12 h-12 flex items-center justify-center rounded-full"
                href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram"
                title="Going to the enigma instagram profile">
                <svg width="28" height="28" class="text-white fill-white">
                    <use xlink:href="./assets/sprites.svg#instagram" />
                </svg>
            </a>

            <!-- Botón de LinkedIn -->
            <a class="  hover:bg-sky-600 hover:scale-110 transition-transform p-2 w-12 h-12 flex items-center justify-center rounded-full"
                href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"
                title="Going to the enigma linkedin profile">
                <svg width="28" height="28" class="text-white fill-white">
                    <use xlink:href="./assets/sprites.svg#linkedin" />
                </svg>
            </a>


        </section>





        <!-- <svg width="28" height="28">
            <use xlink:href="./assets/sprites.svg#node" use/>
        </svg>

        <svg width="28" height="28">
            <use xlink:href="./assets/sprites.svg#instagram" use/>
        </svg> -->
    </header>
    <footer>
        © 2025 Enigma proyect. Todos los derechos reservados.
    </footer>
</body>

</html>
