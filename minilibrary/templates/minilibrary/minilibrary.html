<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Meta básicos -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Descripción de tu sitio" />
    <meta name="author" content="Tu nombre" />
    <title>Mi Mini Biblioteca</title>

    <link rel="icon" href="/favicon.ico" />

    <link rel="stylesheet" href="styles.css" />


</head>

<body>

    <header>
        <h1>Mi Mini Biblioteca 📚</h1>
    </header>

    <main>
        <ul>
            {% for book in page_obj %}
                <li>{{ book.title }} - {{ book.author }}</li>
                {% empty %}
                <li>No hay libros disponibles.</li>
            {% endfor %}
        </ul>
        <form method="get">
            <label for="author">Filtrar por autor:</label>
            <input type="text" id="author" name="query_search" placeholder="Nombre del autor o titulo " value="{{query}}"/>
            <button type="submit">Enviar</button>
        </form>
    </main>

    <footer>
        <!-- cantitad de la pagina -->
        <small>{{author}}</small>
    </footer>

    <script src="app.js"></script>

</body>
</html>
